<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS TRANSIT — Mission Console</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a0e14;
      --bg-panel: rgba(10, 14, 20, 0.85);
      --bg-glass: rgba(20, 30, 45, 0.6);
      --cyan: #00e5ff;
      --cyan-dim: #005f6b;
      --amber: #ffab00;
      --red: #ff1744;
      --magenta: #e040fb;
      --green: #00e676;
      --text-primary: #e0e6ed;
      --text-secondary: #8899aa;
      --font-mono: 'Courier New', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --border: 1px solid rgba(0, 229, 255, 0.2);
      --glow-cyan: 0 0 8px rgba(0, 229, 255, 0.3);
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
    }
    #app {
      width: 100%; height: 100%;
      display: grid;
      grid-template-rows: 36px 1fr 180px;
      grid-template-columns: 320px 1fr 300px;
      grid-template-areas:
        "topbar topbar topbar"
        "left center right"
        "bottom bottom bottom";
    }
    /* Responsive: collapse side columns below 1100px */
    @media (max-width: 1100px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-areas:
          "topbar"
          "center"
          "bottom";
      }
      #left-panel, #right-panel { display: none; }
    }
    #sim-banner {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 9999;
      background: var(--amber);
      color: #000;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 0;
      letter-spacing: 2px;
    }
    #top-bar { grid-area: topbar; margin-top: 20px; }
    #left-panel { grid-area: left; }
    #center-view { grid-area: center; position: relative; }
    #right-panel { grid-area: right; }
    #bottom-panel { grid-area: bottom; }

    .panel {
      background: var(--bg-panel);
      border: var(--border);
      overflow-y: auto;
      padding: 4px;
    }
    .panel::-webkit-scrollbar { width: 4px; }
    .panel::-webkit-scrollbar-thumb { background: var(--cyan-dim); border-radius: 2px; }

    /* Fidelity badges */
    .fidelity-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      letter-spacing: 1px;
      vertical-align: middle;
      margin-left: 4px;
    }
    .fidelity-high { background: var(--green); color: #000; }
    .fidelity-medium { background: var(--amber); color: #000; }
    .fidelity-scripted { background: var(--text-secondary); color: #000; }

    /* AI content marker */
    .ai-content { border-left: 2px solid var(--magenta); padding-left: 6px; }
    .ai-label {
      color: var(--magenta);
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 1px;
    }

    /* Synthetic data banner */
    .synthetic-banner {
      background: rgba(255, 171, 0, 0.15);
      border: 1px solid var(--amber);
      color: var(--amber);
      font-family: var(--font-mono);
      font-size: 10px;
      text-align: center;
      padding: 2px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="sim-banner">⚠ SIMULATION: NOT FLIGHT SOFTWARE ⚠</div>
  <div id="app">
    <header id="top-bar" class="panel"></header>
    <aside id="left-panel" class="panel"></aside>
    <main id="center-view"></main>
    <aside id="right-panel" class="panel"></aside>
    <footer id="bottom-panel" class="panel"></footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
