<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS TRANSIT — Mission Control Console</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg-canvas: #07090E;
      --bg-panel: #0B0F17;
      --bg-card: #111827;
      --bg-hover: #1E293B;
      --border-primary: #1E293B;
      --border-subtle: rgba(30, 41, 59, 0.6);
      
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --nominal-text: #34D399;
      --nominal-bg: rgba(16, 185, 129, 0.12);
      --nominal-border: rgba(16, 185, 129, 0.28);
      
      --caution-text: #FBBF24;
      --caution-bg: rgba(245, 158, 11, 0.12);
      --caution-border: rgba(245, 158, 11, 0.28);
      
      --critical-text: #F87171;
      --critical-bg: rgba(239, 68, 68, 0.12);
      --critical-border: rgba(239, 68, 68, 0.28);
      
      --control-text: #38BDF8;
      --control-bg: rgba(56, 189, 248, 0.12);
      --control-border: rgba(56, 189, 248, 0.35);

      --font-sans: 'Inter', 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Geist Mono', 'SF Mono', Consolas, monospace;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbars */
    *::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    *::-webkit-scrollbar-track {
      background: transparent;
    }
    *::-webkit-scrollbar-thumb {
      background: var(--border-primary);
      border-radius: 2px;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    /* Root Shell */
    #root-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-panel);
    }

    /* Top Warning Banner */
    #sim-banner {
      height: 22px;
      line-height: 22px;
      flex-shrink: 0;
      background: #D97706;
      color: #07090E;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      user-select: none;
      z-index: 50;
    }

    /* Global Telemetry Header Bar */
    #top-bar {
      height: 40px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-primary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 40;
    }

    /* Main Workspace */
    #workspace {
      height: calc(100vh - 62px);
      flex: 1;
      display: flex;
      overflow: hidden;
      background: var(--bg-canvas);
    }

    /* Left Activity Rail */
    #activity-rail {
      width: 48px;
      flex-shrink: 0;
      background: var(--bg-canvas);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 0;
      gap: 4px;
      z-index: 30;
      user-select: none;
    }

    /* Left Inspector Drawer */
    #left-panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    /* Center Column (Viewport 62% + Fault Matrix 38%) */
    #center-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-canvas);
    }

    #center-view {
      height: 62%;
      flex-shrink: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-canvas);
    }

    #bottom-panel {
      height: 38%;
      flex: 1;
      border-top: 1px solid var(--border-primary);
      background: var(--bg-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    /* Right Telemetry Sidebar */
    #right-panel {
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-primary);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 20;
    }

    /* Numeric tabular styling */
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="root-container">
    <div id="sim-banner">▲ SIMULATION: NOT FLIGHT SOFTWARE ▲</div>
    <header id="top-bar"></header>
    <div id="workspace">
      <nav id="activity-rail"></nav>
      <aside id="left-panel"></aside>
      <section id="center-col">
        <main id="center-view"></main>
        <footer id="bottom-panel"></footer>
      </section>
      <aside id="right-panel"></aside>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
